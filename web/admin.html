<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 12 14 30h11v16h14V30h11z' fill='white'/%3E%3C/svg%3E">
<title>shareUp</title>
<style>/* shared files */
.fp{padding:20px}
@media (max-width:480px){.fp{padding:14px}}
.fhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.fpath{font-size:12px;color:var(--mute);margin-top:2px;word-break:break-all}
.facts{display:flex;gap:8px;flex-wrap:wrap}

.note{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:rgba(245,165,36,.13);border:1px solid rgba(245,165,36,.45);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.fnone{text-align:center;padding:42px 16px}
.fnone .big{font-size:46px;line-height:1}
.fnone h3{margin:12px 0 4px;font-size:17px}
.fnone p{margin:0 0 16px;color:var(--mute);font-size:14px}
.dz{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mute);margin-bottom:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.dz svg{width:30px;height:30px;color:var(--g1);margin-bottom:2px}
.dz b{color:var(--text);font-weight:600;font-size:15px}
kbd{background:var(--field);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font:600 12px ui-monospace,Consolas,monospace;color:var(--text)}
.fup{background:var(--field);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.fup small{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:1px 0 8px}
.fup .pb{margin:0}
.nf{display:flex;gap:8px;margin-bottom:14px}
.crumbhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:14px;min-width:0}
.crumbs button{background:none;border:0;color:var(--mute);padding:4px 8px;border-radius:8px;font:inherit}
.crumbs button:hover{background:var(--field);color:var(--text)}
.crumbs button:last-child{color:var(--text);font-weight:600}
.crumbs i{color:var(--mute);font-style:normal}
.fcount{font-size:12.5px;color:var(--mute);white-space:nowrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.ft{position:relative;background:var(--field);border:1px solid transparent;border-radius:14px;padding:8px;cursor:pointer;min-width:0;user-select:none}
.ft:hover{border-color:var(--g1)}
.fth{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.fth img,.fth video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.fth svg.fold{width:62%;height:auto}
.fb{width:54%;aspect-ratio:.8;border-radius:8px;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.vi{position:absolute;left:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.vi::after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.fn{font-size:13px;margin-top:8px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.fs{font-size:11.5px;color:var(--mute)}
.fx{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;display:none;place-items:center;font-size:17px;line-height:1;padding:0}
.ft:hover .fx,.ft:focus-within .fx{display:grid}
.fx:hover{background:var(--bad)}
.fm{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;display:none;place-items:center;font-size:15px;line-height:1;padding:0}
.ft:hover .fm,.ft:focus-within .fm{display:grid}
.fm:hover{background:var(--g1)}
.ft.dt{border-color:var(--g1);background:color-mix(in srgb,var(--g1) 20%,transparent)}
.ft.cut{opacity:.5}
.crumbs button.dt{background:color-mix(in srgb,var(--g1) 28%,transparent);color:var(--text)}
.ren{width:100%;box-sizing:border-box;font:inherit;font-size:13px;margin-top:8px;background:var(--bg);color:var(--text);border:1px solid var(--g1);border-radius:6px;padding:3px 5px}
.cm{position:fixed;z-index:60;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
.cm.on{display:block}
.cm button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:8px 12px;border-radius:8px;font:inherit;font-size:14px}
.cm button:hover{background:var(--field)}
.cm button.dg{color:var(--bad)}
.cm hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.fempty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}
.dover{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(8,12,20,.8);backdrop-filter:blur(4px)}
.dover.on{display:flex}
.dover>div{border:2px dashed var(--g1);border-radius:22px;padding:42px clamp(24px,8vw,72px);text-align:center;color:#fff;background:color-mix(in srgb,var(--g1) 14%,transparent)}
.dover svg{width:46px;height:46px;color:var(--g1)}
.dover b{display:block;font-size:20px;margin-top:8px}
.dover span{display:block;font-size:14px;opacity:.75;margin-top:2px;word-break:break-all}

.mback{position:fixed;inset:0;z-index:90;background:rgba(5,8,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mback[hidden]{display:none}
.mbox{width:100%;max-width:420px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:auto}
.mbox .mic{width:70px;height:70px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:32px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
.mbox h2{margin:0 0 4px;font-size:20px}.mbox .mn{font-weight:650;font-size:17px}.mbox small{display:block;color:var(--mute);margin-top:4px}
.mbar{height:6px;border-radius:99px;background:var(--field);overflow:hidden;margin:16px 0}.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width 1s linear}
.mbtn{display:flex;flex-direction:column;gap:9px}.mbtn .b,.mbtn .g{width:100%}
.dev{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.dev .dd{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}.dev .dd.off{background:var(--mute)}
.dev .dx{flex:1;min-width:0}.dev .dx b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dev .dx small{color:var(--mute);font-size:12.5px}
.dev .g,.dev .b{padding:6px 12px;font-size:13px}
.pwrow{display:flex;gap:10px;padding:0 20px 16px}.pwrow input{flex:1;min-width:0}
input[type=password]{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font:inherit;font-size:14px;min-width:0}
.warnb{margin:0 20px 16px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-size:13.5px;font-weight:600}
.subh{padding:14px 20px 6px;font-weight:700;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.guide{padding:16px 20px}.guide.warn{border-color:color-mix(in srgb,#f59e0b 60%,var(--line))}.guide.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.gh{font-weight:700;font-size:17px;margin-bottom:8px}.gp{color:var(--mute);font-size:14px}
.gr{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:15px}.gr i{font-style:normal;width:26px;text-align:center;font-size:18px;flex:none}
.gr.ok{color:var(--ok)}.gr.bad{color:var(--bad)}.gr.cur{font-weight:650}
.gspin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--g1);animation:gsp 1s linear infinite}
@keyframes gsp{to{transform:rotate(360deg)}}
.gact{margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

:root{--bg:#0b1020;--panel:#141b2e;--line:#27324d;--field:#1b2440;--text:#eef2ff;--mute:#9aa7c7;--ok:#22c55e;--bad:#f43f5e;--g1:#3b82f6;--g2:#8b5cf6}
@media (prefers-color-scheme:light){:root{--bg:#f2f4ff;--panel:#fff;--line:#dde3f6;--field:#eff2ff;--text:#151a3a;--mute:#5a6685}}
body[data-tab=connect]{--g1:#3b82f6;--g2:#8b5cf6}
body[data-tab=recv]{--g1:#10b981;--g2:#06b6d4}
body[data-tab=files]{--g1:#f97316;--g2:#ec4899}
body[data-tab=settings]{--g1:#a855f7;--g2:#6366f1}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;color:var(--text);font:15px/1.6 "Segoe UI Variable Text","Segoe UI","Nirmala UI",system-ui,-apple-system,sans-serif;padding:clamp(14px,3vw,30px) clamp(12px,3vw,24px) 40px;
 background:radial-gradient(900px 420px at 90% -8%,color-mix(in srgb,var(--g2) 24%,transparent),transparent),radial-gradient(760px 400px at -10% 0,color-mix(in srgb,var(--g1) 20%,transparent),transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--g1) 45%,transparent)}
.logo .ic{width:24px;height:24px;stroke-width:2.2}
h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.sub{font-size:13px;color:var(--mute)}
.hr{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.off{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent)}
.langs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px}
.langs button{background:none;border:0;color:var(--mute);padding:4px 12px;border-radius:99px;font:inherit;font-size:13px;font-weight:600}
.langs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.nav button{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:9px 12px;border-radius:16px;font-weight:600;font-size:14px;text-align:left;line-height:1.25;transition:.15s}
.nav button:hover{border-color:var(--t1)}
.nav .chip{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2))}
.nav button.on{color:var(--text);border-color:var(--t1);background:linear-gradient(135deg,color-mix(in srgb,var(--t1) 16%,var(--panel)),color-mix(in srgb,var(--t2) 10%,var(--panel)));box-shadow:0 8px 20px color-mix(in srgb,var(--t1) 28%,transparent)}
@media (max-width:640px){.nav{gap:6px}.nav button{flex-direction:column;text-align:center;font-size:12px;padding:8px 4px;gap:6px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:16px;overflow:hidden}
.phead{display:flex;gap:14px;align-items:center;padding:16px 20px;background:linear-gradient(120deg,color-mix(in srgb,var(--g1) 17%,transparent),color-mix(in srgb,var(--g2) 9%,transparent));border-bottom:1px solid var(--line)}
.pico{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
.pico .ic{width:22px;height:22px}
h2{margin:0;font-size:17px;font-weight:700}
.phead p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.setblock{padding:16px 20px}
.setblock+.setblock{border-top:1px solid var(--line)}
.lab{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.lab .ic{color:var(--g1)}
.path{display:flex;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.chip2{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px}
.chip2.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip2.off{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.b,.g{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:8px 16px;font-weight:600;white-space:nowrap}
.b{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;box-shadow:0 4px 12px color-mix(in srgb,var(--g1) 30%,transparent)}
.b:hover{filter:brightness(1.08)}
.b:disabled{opacity:.55}
.g{background:transparent;color:var(--text);border:1px solid var(--line)}
.g:hover{border-color:var(--g1)}
.g:disabled{opacity:.5}
.dgr{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.dgr:hover{border-color:var(--bad)}
.cb{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:9px 16px;font-weight:700;white-space:nowrap;border:2px solid transparent;color:#fff;cursor:pointer}
.cb:hover{filter:brightness(1.1)}.cb:active{transform:scale(.98)}.cb:disabled{opacity:.55}
.cb-ok{background:#16a34a;border-color:#15803d}                         /* green  = allow / yes / go */
.cb-blue{background:#2563eb;border-color:#1d4ed8}                       /* blue   = normal action   */
.cb-red{background:#dc2626;border-color:#b91c1c}                        /* red    = delete / deny / stop */
.cb-amb{background:transparent;color:#d97706;border-color:#f59e0b}      /* amber  = later / not now */
.cb-gry{background:var(--field);color:var(--text);border-color:var(--line)}/* grey   = cancel */
.mbox{border-top-width:6px;border-top-color:var(--ac,#3b82f6)}
.mbox .mic{background:var(--ac,#3b82f6)}
#mreq .mbox{--ac:#2563eb}
#gm .mbox{--ac:#0891b2}
#cdlg .mbox{--ac:#2563eb}
#cdlg .mbox.danger{--ac:#dc2626}#cdlg .mbox.warn{--ac:#f59e0b}
#mreq .mcode{display:inline-block;margin:6px 0 2px;padding:5px 12px;border-radius:10px;background:color-mix(in srgb,#f59e0b 18%,transparent);color:#f59e0b;font-weight:700}
#mreq .mcode b{font-size:18px;letter-spacing:.12em}
#mreq .mbar i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
#mreq .mbtn #mrD{margin-top:10px}
#gm .hl li::marker{color:#0891b2;font-weight:700}
.mbtn.row{flex-direction:row}.mbtn.row .cb{flex:1}
#cdlg{z-index:95}
#cdlg h2{font-size:17px;font-weight:650;line-height:1.35;margin:0 0 14px;word-break:break-word}
#cdlg input[type=text]{width:100%;box-sizing:border-box;background:var(--field);color:var(--text);border:2px solid var(--line);border-radius:11px;padding:9px 12px;font:inherit;font-size:15px;margin-bottom:14px}
#cdlg input[type=text]:focus{outline:0;border-color:#2563eb}
.upd .cb{padding:8px 14px}
/* small approval window (opens by itself when a phone asks to connect, even from the tray) */
body.pop>*:not(.mback){display:none!important}
body.pop #gm,body.pop #cdlg{display:none!important}
body.pop{background:var(--bg)}
body.pop #mreq{background:transparent;padding:8px}
.dev button[data-a=rename]{color:#3b82f6;border-color:#3b82f6}
.dev button[data-a=trust]{background:#16a34a;color:#fff;border-color:#15803d}
.dev button[data-a=kick],.dev button[data-a=untrust]{background:#dc2626;color:#fff;border-color:#b91c1c}
input[type=text],input[type=number],select{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font:inherit;font-size:14px;min-width:0}
.switch{position:relative;width:50px;height:29px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.slider{position:absolute;inset:0;background:var(--field);border:1px solid var(--line);border-radius:99px;transition:.2s}
.slider::before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:var(--mute);transition:.2s}
.switch input:checked+.slider{background:linear-gradient(135deg,var(--ok),#14b8a6);border-color:transparent}
.switch input:checked+.slider::before{transform:translateX(21px);background:#fff}
.switch input:focus-visible+.slider{outline:2px solid var(--g1);outline-offset:2px}
.pb{height:7px;background:var(--field);border-radius:99px;overflow:hidden;margin:0 0 14px}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s}
.err{color:var(--bad)}
.upd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px;border-radius:16px;background:linear-gradient(120deg,color-mix(in srgb,#10b981 20%,var(--panel)),color-mix(in srgb,#06b6d4 14%,var(--panel)));border:1px solid color-mix(in srgb,#10b981 55%,var(--line))}
.upd div{flex:1;min-width:180px}.upd small{display:block;color:var(--mute);font-size:13px}
.hero{padding:20px}
.seg{display:inline-flex;background:var(--field);border-radius:14px;padding:4px;gap:2px;margin-bottom:18px}
.seg button{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--mute);padding:8px 18px;border-radius:11px;font-weight:600}
.seg button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--g1) 35%,transparent)}
.split{display:flex;gap:clamp(14px,3vw,26px);align-items:center}
@media (max-width:560px){.split{flex-direction:column;align-items:stretch}}
.qrcol{width:clamp(150px,30vw,208px);aspect-ratio:1;flex:none;margin:0 auto}
#qr{width:100%;height:100%;background:#fff;border-radius:16px;padding:10px;display:block;box-shadow:0 10px 28px color-mix(in srgb,var(--g1) 30%,transparent)}
.ph{width:100%;height:100%;border:2px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--g1)}
.ph .ic{width:56px;height:56px;stroke-width:1.6}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--g1);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.info{flex:1;min-width:0}
.info p{margin:4px 0 14px;color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:13px;padding:6px 6px 6px 14px}
.row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 14px ui-monospace,Consolas,monospace}
.acts{display:flex;gap:8px;margin-top:10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 20px 20px}
@media (max-width:700px){.steps{grid-template-columns:1fr}}

body{animation:pgIn .35s ease both}

function ask(msg,o){o=o||{};const kind=o.kind||'info';
 return new Promise(res=>{
  const m=$('#cdlg'),box=m.firstElementChild,inp=$('#cdIn'),ok=$('#cdO'),no=$('#cdC');
  box.className='mbox '+kind;
  $('#cdI').textContent=kind==='danger'?'🗑':kind==='warn'?'⚠':o.input!=null?'✎':'?';
  $('#cdT').textContent=msg;
  inp.hidden=o.input==null;if(o.input!=null)inp.value=o.input;
  ok.className='cb '+(kind==='danger'?'cb-red':kind==='warn'?'cb-amb':'cb-blue');
  ok.textContent=o.ok||t('okB');no.textContent=t('cancel');
  const done=v=>{m.hidden=true;document.removeEventListener('keydown',key,true);res(v)};
  const val=()=>o.input!=null?inp.value:true;
  const key=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(o.input!=null?null:false)}
   else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();done(val())}};
  ok.onclick=()=>done(val());no.onclick=()=>done(o.input!=null?null:false);
  m.onclick=e=>{if(e.target===m)no.onclick()};
  document.addEventListener('keydown',key,true);
  m.hidden=false;(o.input!=null?inp:no).focus();if(o.input!=null)inp.select();
 });
}

 let p;

/* ---------- adding files: queue with 3 parallel uploads ---------- */
let Q=[],act=0,tot=0,doneB=0,nAll=0,nOk=0,nBad=0,seq=0,live={},curName='';
function enqueue(list){
 if(!list.length)return;
 if(!rootDirOf(S)){toast(t('chooseFirst'),2600);return}
 list.forEach(x=>{x.id=++seq;x.dir=cur;x.root=root();Q.push(x);tot+=x.f.size;nAll++});
 pump();
}
function pump(){
 while(act<3&&Q.length){const x=Q.shift();act++;send(x).then(()=>{act--;pump()})}
 if(!act&&!Q.length)finish();else paint();
}
function send(x){return new Promise(res=>{
 const sub=[x.dir,x.sub].filter(Boolean).join('/');
 const xr=new XMLHttpRequest();
 xr.open('POST','/admin/put?root='+x.root+'&path='+encodeURIComponent(sub)+'&name='+encodeURIComponent(x.f.name));
 curName=x.f.name;
 xr.upload.onprogress=e=>{live[x.id]=e.loaded;paint()};
 const end=ok=>{delete live[x.id];doneB+=x.f.size;ok?nOk++:nBad++;res()};
 xr.onload=()=>end(xr.status===200);
 xr.onerror=()=>end(false);
 xr.send(x.f);
})}
function paint(){
 const got=doneB+Object.values(live).reduce((a,b)=>a+b,0);
 const pct=tot?Math.min(100,Math.round(got/tot*100)):100;
 $('#fup').hidden=false;
 $('#fupt').textContent=t('adding',Math.min(nAll,nOk+nBad+1),nAll);
 $('#fupn').textContent=curName;$('#fupf').style.width=pct+'%';
}
function finish(){
 if(!nAll)return;
 toast(nBad?t('addedFail',nOk,nBad):t('addedN',nOk),nBad?3200:2000);
 Q=[];tot=doneB=nAll=nOk=nBad=0;live={};
 setTimeout(()=>{if(!act&&!Q.length)$('#fup').hidden=true},700);
 lastL='';loadFiles();
}

function over(on){
 const d=$('#dover');
 if(on){
  const dir=rootDirOf(S),ok=!!dir;
  $('#dtitle').textContent=ok?t(root()==='recv'?'dropR':'dropS'):t('chooseFirst');
  $('#dname').textContent=ok?baseName(dir)+(cur&&inFiles()?' / '+cur.split('/').join(' / '):''):'';
 }

}
document.addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy';over(true)});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)over(false)});
document.addEventListener('dragend',()=>over(false));
document.addEventListener('drop',e=>{
 if(!hasFiles(e))return;
 e.preventDefault();over(false);
 const dt=e.dataTransfer;
 const ents=[...(dt.items||[])].filter(i=>i.kind==='file').map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
 const files=[...(dt.files||[])];
 if(!inFiles())setTab('files');
 if(!ents.length){enqueue(files.map(f=>({f,sub:''})));return}
 (async()=>{const out=[];for(const en of ents)await walk(en,'',out);enqueue(out)})();
});
async function walk(en,prefix,out){
 if(en.isFile){await new Promise(res=>en.file(f=>{out.push({f,sub:prefix});res()},()=>res()))}
 else if(en.isDirectory){
  const sub=prefix?prefix+'/'+en.name:en.name,rd=en.createReader();
  while(true){
   const batch=await new Promise(res=>rd.readEntries(res,()=>res([])));
   if(!batch.length)break;
   for(const c of batch)await walk(c,sub,out);
  }
 }
}

const two=n=>String(n).padStart(2,'0');
function stamp(){const d=new Date();return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())+' '+two(d.getHours())+'.'+two(d.getMinutes())+'.'+two(d.getSeconds())}
function uploadPasted(files){
 const list=files.map(f=>{
  if(!f.name||/^image\.(png|jpe?g|gif|webp)$/i.test(f.name)){
   const ext=((f.type.split('/')[1])||'png').replace('jpeg','jpg');
   return{f:new File([f],'Pasted '+stamp()+'.'+ext,{type:f.type}),sub:''};
  }
  return{f,sub:''};
 });
 if(!inFiles())setTab('files');
 enqueue(list);
}
document.addEventListener('paste',e=>{
 const cd=e.clipboardData;
 const files=cd&&cd.files?[...cd.files]:[];   // read now: the clipboard is not available after an await
 const typing=/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
 if(inFiles()&&!typing){
  e.preventDefault();
  (async()=>{
   const n=await pasteNative(cur);                 // files or folders copied in Explorer / copied here
   if(n){if(n.cut&&n.done){clip=null;updatePaste()}return}
   if(files.length)uploadPasted(files);            // a screenshot or an image copied from a browser
   else if(clip)pasteInternal(cur);
  })();
  return;
 }
 if(!files.length)return;
 e.preventDefault();
 uploadPasted(files);
});

 }
}
function swapBox(el,html){   // fade the old content out, put the new one in, fade it in
 if(!el.innerHTML.trim()){el.innerHTML=html;setFound();return}
 el.classList.add('sw');clearTimeout(el._t);
 el._t=setTimeout(()=>{el.innerHTML=html;el.classList.remove('sw');setFound()},150);
}
function setFound(f){
 if(f!==undefined)lastFound=f;
 const w=document.querySelector('#gmb .foundw');if(!w)return;
 const h=''; // the "hotspot found" line is not shown: only the connected message matters
 if(w.dataset.h!==h){w.dataset.h=h;w.innerHTML=h}
}
function drawGuide(g){
 const c=$('#gcard'),gm=$('#gm'),gb=$('#gmb');
 if(g&&g.kind==='offline'){
  if(gHide){
   gmShow(false);gmKey='';
   const h='<div class="gh">📶 '+t('hsBanT')+'</div><div class="gact"><button class="b" data-act="reopen">'+t('hsOpenGuide')+'</button></div>';
   c.className='panel guide warn';if(c.dataset.h!==h){c.dataset.h=h;c.innerHTML=h}c.hidden=false;return}
  c.hidden=true;c.innerHTML='';c.dataset.h='';
  const found=(g.nets||[])[0]||'',k=g.step+'|'+(g.sel||'')+LANG;
  if(k!==gmKey){
   gmKey=k;let s='';
   if(g.step===4){
    s='<div class="mic">📶</div><h2>'+t('hs4T')+'</h2><small>'+esc(g.sel)+'</small><div class="spin"></div>';
   }else{
    s='<div class="mic">📶</div><h2>'+t('hs1T')+'</h2>'
     +'<ol class="hl"><li>'+t('hsSt1')+'</li><li>'+t('hsSt2')+'</li><li>'+t('hsSt3')+'</li></ol>'
     +'<div class="foundw"></div>'
     +'<div class="mbtn"><button class="cb cb-blue" data-w="panel"><svg class="ic"><use href="#i-wifi"/></svg>'+t('hsPanel')+'</button><button class="cb cb-amb" data-w="later">'+t('hsLater')+'</button></div>'
     +'<div class="why"><b>'+t('hsWhyT')+'</b>'+t('hsWhy')+'</div>';
   }
   swapBox(gb,s);
  }
  gmShow(true);setFound(found);return;
 }
 gHide=false;gmShow(false);gmKey='';
 if(!g||!g.kind){c.hidden=true;c.innerHTML='';return}
 let h='';
 if(g.kind==='back'){
  c.className='panel guide good';h='<div class="gh">✅ '+t('gBack')+'</div><div class="gp">'+t('gBackD')+'</div>';
 }else if(g.kind==='joined'){
  c.className='panel guide good';h='<div class="gh"><svg class="tick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>'+(g.net?t('hsJoinedNet',esc(g.net)):t('hsJoined'))+'</div><div class="gp">'+t('hsJoinedD')+'</div>';
 }else{
  c.className='panel guide good';h='<div class="gh">✅ '+t('gDone')+'</div>';
 }
 if(c.dataset.h!==h){c.dataset.h=h;c.innerHTML=h}
 c.hidden=false;
}
$('#gmb').addEventListener('click',async e=>{
 const b=e.target.closest('[data-w]');if(!b)return;
 if(b.dataset.w==='panel')api('/admin/wifi',{op:'panel'});
 else if(b.dataset.w==='later'){gHide=true;drawGuide({kind:'offline',step:1})}
});
$('#gmb').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='wpw'){e.preventDefault();$('#gmb').querySelector('[data-w="pass"]').click()}});
$('#gcard').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='reopen'){gHide=false;gmKey='';if(S&&S.smart)drawGuide(S.smart.guide)}
 else if(b.dataset.act==='off'){const j=await api('/admin/set',{offlineOn:true});if(j)render(j)}
 else if(b.dataset.act==='set')setTab('settings')};
function smRender(s){
 const sm=s.smart;if(!sm)return;
 setVal('#wkUrl',sm.workerUrl||'');
 $('#anOn').checked=!!sm.autoNet;$('#ofOn').checked=!!sm.offlineOn;
 const e=$('#wkSt');
 if(!sm.configured){e.textContent=t('wkNone');e.className='chip2 off'}
 else if(sm.registered){e.textContent=t('wkReady');e.className='chip2 ok'}
 else{e.textContent=sm.regErr||t('wkWait');e.className='chip2'+(sm.regErr?' off':'')}
}
$('#wkSave').onclick=async()=>{const j=await api('/admin/set',{workerUrl:$('#wkUrl').value.trim()});if(j){toast(t('smSaved'));render(j)}};
$('#anOn').onchange=async e=>{const j=await api('/admin/set',{autoNet:e.target.checked});if(j)render(j)};
$('#ofOn').onchange=async e=>{const j=await api('/admin/set',{offlineOn:e.target.checked});if(j)render(j)};
$('#wkReset').onclick=async()=>{if(!await ask(t('wkResetQ'),{kind:'warn',ok:t('wkReset')}))return;const j=await api('/admin/set',{resetFixed:true});if(j)render(j)};

let pullT=0,pulling=false,again=false;
async function doPull(){
 if(pulling){again=true;return}
 pulling=true;
 const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),6000);   // a stuck request must never freeze the page
 try{render(await (await fetch('/admin/state',{method:'POST',signal:ac.signal})).json())}catch(e){}
 clearTimeout(tm);pulling=false;
 if(again){again=false;doPull()}
}
function pull(){clearTimeout(pullT);pullT=setTimeout(doPull,40)}
(async()=>{render(await api('/admin/state'));
 setInterval(()=>{if(!document.hidden)pull()},2000);                      // safety net
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
 try{const es=new EventSource('/admin/events');es.onmessage=pull}catch(e){}   // the PC says "something changed": refresh now
 setTab('connect')
})();
</script></body></html>
