/* ================= send to PC (auto-upload as soon as you press OK) ================= */
const ups=$('#ups');
async function sendPicked(el){
 const fs=[...el.files];
 if(!fs.length)return;
 toast(fs.length>1?tr('sendN',fs.length):tr('send1'),1500);
 for(const f of fs){try{await up(f)}catch(e){toast(tr('couldNot')+' '+f.name,2500)}}
 try{el.value=''}catch(e){}   // clear only AFTER everything is sent (Android hands over content:// files that must stay readable)
}
for(const id of['g','f']){const el=$('#'+id);el.onchange=()=>sendPicked(el);el.oninput=null}
const CHUNK=16*1024*1024; // small pieces so big files also work over the internet link
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function sendChunk(url,blob,onp){return new Promise(res=>{
 const x=new XMLHttpRequest();x.open('POST',url);
 x.upload.onprogress=e=>{if(e.lengthComputable)onp(e.loaded)};
 x.onload=()=>res({s:x.status,t:x.responseText});
 x.onerror=()=>res({s:0,t:''});x.ontimeout=x.onerror;
 x.send(blob);
})}
function localThumb(f,box){
 const t=(f.type||'');
 try{
  if(t.startsWith('image/')){const im=document.createElement('img');im.src=URL.createObjectURL(f);im.onerror=()=>{box.textContent='';box.append(badge(f.name))};box.append(im);return}
  if(t.startsWith('video/')){const v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;v.src=URL.createObjectURL(f)+'#t=0.1';box.append(v);return}
 }catch(e){}
 box.append(badge(f.name));
}
function up(f){return new Promise(async res=>{
 const row=document.createElement('div');row.className='up';
 row.innerHTML='<div class="tb"></div><div class="m"><div class="n"></div><progress max="100" value="0"></progress><small>0%</small></div>';
 row.querySelector('.n').textContent=f.name;localThumb(f,row.querySelector('.tb'));ups.prepend(row);
 const p=row.querySelector('progress'),s=row.querySelector('small');
 const id=rid(),name=encodeURIComponent(f.name);
 let off=0,fails=0,sent=false;
 const done=()=>{s.textContent='✓ '+tr('sent');s.className='ok';p.value=100};
 const show=n=>{const v=f.size?Math.min(100,Math.round(n/f.size*100)):100;p.value=v;s.textContent=v+'%'};
 while(true){
  const end=Math.min(off+CHUNK,f.size),last=end>=f.size;
  const r=await sendChunk('/upload?name='+name+'&id='+id+'&off='+off+'&last='+(last?1:0),
   f.slice(off,end),l=>show(off+l));
  if(r.s===200){fails=0;sent=false;off=end;show(off);if(last){done();break}continue}
  if(r.s===409){
   const pos=parseInt(r.t);
   if(!isNaN(pos)&&pos>=0&&pos<=f.size&&pos!==off){off=pos;continue}   // resume from where the PC is
   if(last&&sent){done();break}                                         // final piece already arrived
  }
  sent=true;
  if(++fails>5){s.textContent='✗ '+tr('failed');s.className='bad';break}
  s.textContent=tr('retrying');await new Promise(r=>setTimeout(r,1500*fails));
 }
 res();
})}

function sz(n){const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
const IMG=['jpg','jpeg','png','gif','webp','bmp','svg','avif'];
const VID=['mp4','webm','mov','m4v'];
const MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',avif:'image/avif',mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm'};
const GROUPS=[
 [['pdf'],'#dc2626','PDF'],
 [['doc','docx','odt','rtf'],'#2563eb','DOC'],
 [['xls','xlsx','csv','ods'],'#16a34a','XLS'],
 [['ppt','pptx','odp'],'#ea580c','PPT'],
 [['zip','rar','7z','tar','gz'],'#ca8a04','ZIP'],
 [['mp3','wav','flac','m4a','aac','ogg'],'#9333ea','AUDIO'],
 [['mp4','mkv','avi','mov','webm'],'#db2777','VIDEO'],
 [['apk','exe','msi','dmg'],'#475569','APP'],
 [['txt','md','log'],'#64748b','TXT'],
 [['jpg','jpeg','png','gif','webp','bmp','svg','avif','heic'],'#0891b2','IMG'],
];
const extOf=n=>(n.includes('.')?n.split('.').pop():'').toLowerCase();
const ENC=p=>p.split('/').map(encodeURIComponent).join('/');
const bname=p=>p.split('/').pop();
function badge(name){
 const e=extOf(name);
 let c='#6b7280',l=(e||'FILE').toUpperCase().slice(0,4);
 for(const g of GROUPS)if(g[0].includes(e)){c=g[1];l=g[2];break}
 const b=document.createElement('div');b.className='badge';b.style.background=c;b.textContent=l;return b;
}
const FOLDER='<svg width="64" height="54" viewBox="0 0 24 20"><path d="M1 3a2 2 0 0 1 2-2h6l2 2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#d97706"/><path d="M1 7h22v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#fbbf24"/></svg>';
const vio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.src=e.target.dataset.src;vio.unobserve(e.target)}}),{rootMargin:'300px'});
function fmtDur(s){if(!isFinite(s))return'';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'):m+':'+String(r).padStart(2,'0')}
function dayLabel(t){
 const d=new Date(t*1000),n=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 const diff=Math.round((b-a)/864e5);
 if(diff===0)return tr('today');if(diff===1)return tr('yest');
 const o={weekday:'short',day:'numeric',month:'short'};if(d.getFullYear()!==n.getFullYear())o.year='numeric';
 return d.toLocaleDateString(LANG==='bn'?'bn-BD':undefined,o);
}

function paintHome(on){

 if(!on||!MEDIA.length){b.hidden=true;return}
 b.hidden=false;
 const ph=MEDIA.filter(m=>!m.v).length,vd=MEDIA.length-ph;
 $('#gsum').textContent=[ph?tr(ph===1?'photo1':'photoN',ph):'',vd?tr(vd===1?'video1':'videoN',vd):''].filter(Boolean).join(' · ');
 const m=$('#mos');m.textContent='';
 const first=MEDIA.slice(0,4);m.className='mos'+(first.length<4?' one':'');

function thumbEl(it,small){

function drawGal(){

 [['all',tr('all'),MEDIA.length],['photo',tr('photos'),ph],['video',tr('videos'),vd]].forEach(([k,l,n])=>{
  const b=document.createElement('button');b.className=FLT===k?'on':'';b.innerHTML=l+'<span>'+n+'</span>';
  b.onclick=()=>{FLT=k;SEL.clear();drawGal();$('#gsc').scrollTop=0};tabs.append(b);
 });
 LIST=MEDIA.filter(m=>FLT==='all'||(FLT==='video')===m.v);

 if(!LIST.length){sc.innerHTML='<div class="empty" style="padding:60px 20px">'+(MEDIA.length?tr('noneTab'):tr('noMedia'))+'</div>';updBar();return}

  const t=document.createElement('div');t.className='gt'+(SEL.has(it.path)?' sel':'');t.dataset.i=i;
  if(it.v){
   const v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;v.dataset.src='/pv/'+ENC(it.path)+'#t=0.1';
   v.onloadedmetadata=()=>{let du=t.querySelector('.dur');if(!du){du=document.createElement('span');du.className='dur';t.append(du)}du.textContent=fmtDur(v.duration)};
   t.append(v);vio.observe(v);

  const ck=document.createElement('span');ck.className='ck';t.append(ck);

 });

function bindTile(t,it,i){
 let timer=0,long=false,sx=0,sy=0;
 t.addEventListener('touchstart',e=>{long=false;const p=e.touches[0];sx=p.clientX;sy=p.clientY;timer=setTimeout(()=>{long=true;if(navigator.vibrate)navigator.vibrate(12);if(!selMode)startSel();toggle(it,t)},480)},{passive:true});
 t.addEventListener('touchmove',e=>{const p=e.touches[0];if(Math.abs(p.clientX-sx)>8||Math.abs(p.clientY-sy)>8)clearTimeout(timer)},{passive:true});
 t.addEventListener('touchend',()=>clearTimeout(timer),{passive:true});
 t.addEventListener('touchcancel',()=>clearTimeout(timer),{passive:true});
 t.addEventListener('contextmenu',e=>e.preventDefault());
 t.onclick=()=>{if(long){long=false;return}if(selMode)toggle(it,t);else openView(i)};
}
function toggle(it,t){
 if(SEL.has(it.path)){SEL.delete(it.path);t.classList.remove('sel')}else{SEL.add(it.path);t.classList.add('sel')}

function saveItems(items){
 items.forEach((it,i)=>setTimeout(()=>{
  const a=document.createElement('a');a.href='/dl/'+ENC(it.path);a.setAttribute('download',bname(it.path));
  document.body.append(a);a.click();a.remove();
 },i*450));

async function shareItems(items){
 toast(tr('preparing'),4000);
 try{
  const files=[];
  for(const it of items){
   const r=await fetch('/dl/'+ENC(it.path));const b=await r.blob();
   files.push(new File([b],bname(it.path),{type:MIME[extOf(it.path)]||b.type}));
  }
  if(navigator.canShare&&navigator.canShare({files}))await navigator.share({files});
  else saveItems(items);
 }catch(e){if(e&&e.name!=='AbortError')saveItems(items)}
}

const slObs=new IntersectionObserver(es=>es.forEach(e=>{
 const s=e.target;
 if(e.isIntersecting){if(!s.dataset.ok){s.dataset.ok=1;fillSlide(s)}}
 else{const v=s.querySelector('video');if(v)v.pause()}
}),{root:$('#vs'),rootMargin:'0px 100% 0px 100%'});

/* ================= files from PC ================= */
let cur='';
function tile(it){
 const full=(cur?cur+'/':'')+it.name;
 const enc=ENC(full);
 const el=document.createElement(it.dir?'div':'a');el.className='tile';
 const th=document.createElement('div');th.className='th';
 const ext=extOf(it.name);
 if(it.dir){th.innerHTML=FOLDER;el.onclick=()=>{cur=full;load()}}
 else{
  el.href='/dl/'+enc;el.setAttribute('download','');
  if(IMG.includes(ext)){
   const im=document.createElement('img');im.loading='lazy';im.src='/pv/'+enc;
   im.onerror=()=>{th.textContent='';th.append(badge(it.name))};th.append(im);
  }else if(VID.includes(ext)){
   const v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;
   v.src='/pv/'+enc+'#t=0.1';v.onerror=()=>{th.textContent='';th.append(badge(it.name))};th.append(v);
  }else th.append(badge(it.name));
 }
 const n=document.createElement('div');n.className='nm';n.textContent=it.name;
 el.append(th,n);
 if(!it.dir){const s=document.createElement('div');s.className='sz';s.textContent=sz(it.size);el.append(s)}
 return el;
}
async function load(){
 const d=$('#dl'),bar=$('#bar');d.textContent='';bar.textContent='';
 try{
  const j=await (await fetch('/api/list?path='+encodeURIComponent(cur))).json();
  if(!j.shareOn){d.innerHTML='<div class="empty">'+tr('shareOff')+'</div>';$('#og').hidden=true;$('#fsec').hidden=true;return}
  if(cur){
   const b=document.createElement('button');b.className='btn2';b.textContent=tr('back');
   b.onclick=()=>{cur=cur.split('/').slice(0,-1).join('/');load()};
   const p=document.createElement('span');p.textContent='/'+cur;bar.append(b,p);
  }
  $('#fsec').hidden=!j.items.length&&!cur;
  if(!j.items.length){d.innerHTML='<div class="empty">'+(cur?tr('empty'):tr('noShared'))+'</div>';return}
  const g=document.createElement('div');g.className='grid';
  j.items.forEach(it=>g.append(tile(it)));d.append(g);
 }catch(e){d.innerHTML='<div class="empty">'+tr('error')+'</div>'}
}
async function refreshAll(){
 const on=await loadMedia();paintHome(on);
 if(!$('#gal').hidden)drawGal();
 load();
}

// ---- access gate: password / PC approval / heartbeat ----
try{const m=location.hash.match(/^#d=([A-Za-z0-9]{16,64})$/);if(m){localStorage.setItem('su_dev',m[1]);history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
let authed=false,hb=0,gpoll=0,gs=null;
function devId(){let v='';try{v=localStorage.getItem('su_dev')||''}catch(e){}
 if(!/^[A-Za-z0-9]{16,64}$/.test(v)){const a=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<16;i++)a[i]=Math.random()*256;
  v=Array.from(a,x=>('0'+x.toString(16)).slice(-2)).join('');try{localStorage.setItem('su_dev',v)}catch(e){}}
 return v}
function gateShow(st,j){gs={st,j:j||{}};gateRender()}
function gateRender(){
 if(!gs)return;const{st,j}=gs;const ic=$('#gic');
 const set=(cls,html,t,d,err)=>{ic.className='gic '+cls;ic.innerHTML=html;$('#gt').textContent=tr(t);const p=$('#gd');p.textContent=d;p.className=err?'gerr':''};
 $('#gbar').hidden=st!=='pending';$('#gpw').hidden=st!=='password';$('#gre').hidden=!(st==='denied'||st==='gone');
 $('#gin').placeholder=tr('gPh');$('#gok').textContent=tr('gGo');$('#gre').textContent=tr(st==='gone'?'gRe':'gTry');
 if(st==='check'||st==='net')set('wait','<div class="gsp"></div>',st==='net'?'gNetT':'gChk',st==='net'?tr('gNetD'):'');
 else if(st==='password')set('lock','🔒','gPwT',j.bad?tr('gPwBad'):tr('gPwD'),j.bad);
 else if(st==='pending'){set('wait','<div class="gsp"></div>','gWaitT',tr('gWaitD',j.left,devId().slice(0,4).toUpperCase()));$('#gfill').style.width=Math.max(0,Math.min(100,(j.left||0)/60*100))+'%'}
 else if(st==='denied')set('bad','✕','gDenyT',tr('gDenyD'));
 else if(st==='locked')set('bad','✕','gLockT',tr('gLockD',j.wait));
 else if(st==='gone')set('wait','⏻','gGoneT',tr('gGoneD'));
 else if(st==='ok')set('ok','✓','gOkT','');
}
async function gateCheck(pw){
 clearTimeout(gpoll);let j;
 try{const r=await fetch('/api/session',{method:'POST',body:JSON.stringify({id:devId(),pw:pw||''})});if(!r.ok)throw 0;j=await r.json()}
 catch(e){gateShow('net');gpoll=setTimeout(()=>gateCheck(),3000);return}
 if(j.status==='ok'){gateShow('ok');setTimeout(()=>{$('#gate').hidden=true;authed=true;beat();refreshAll()},700);return}
 gateShow(j.status,j);
 if(j.status==='pending')gpoll=setTimeout(()=>gateCheck(),1500);
 if(j.status==='locked')gpoll=setTimeout(()=>gateShow('password',{}),(j.wait||5)*1000);
}
function lost(){authed=false;clearInterval(hb);gateShow('gone');$('#gate').hidden=false}
function ping(){fetch('/api/ping',{method:'POST'}).then(r=>{if(r.status===401)lost()}).catch(()=>{})}
function beat(){clearInterval(hb);hb=setInterval(ping,20000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&authed)ping()});
addEventListener('pagehide',e=>{if(authed&&!e.persisted&&navigator.sendBeacon)navigator.sendBeacon('/api/bye')});
$('#gok').onclick=()=>{const v=$('#gin').value;if(v){$('#gin').value='';gateShow('check');gateCheck(v)}};
$('#gin').onkeydown=e=>{if(e.key==='Enter')$('#gok').click()};
$('#gre').onclick=()=>{gateShow('check');gateCheck()};
$('#rf').onclick=refreshAll;applyLang();gateShow('check');gateCheck();
</script></body></html>
